<style>

    margin: 0;

    box-sizing: border-box;

    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;

    display: flex;
    align-items: center;
    justify-content: center;

<svg viewBox="0 0 1600 1000"
     xmlns="http://www.w3.org/2000/svg">

<defs>

    <!-- PIERRE -->
    <linearGradient id="stone" x1="0" x2="1">
        <stop offset="0%" stop-color="#151713"/>
        <stop offset="18%" stop-color="#36372f"/>
        <stop offset="43%" stop-color="#20221d"/>
        <stop offset="67%" stop-color="#414138"/>
        <stop offset="100%" stop-color="#11130f"/>
    </linearGradient>

    <linearGradient id="stoneLight">
        <stop offset="0%" stop-color="#373830"/>
        <stop offset="50%" stop-color="#69675b"/>
        <stop offset="100%" stop-color="#292b25"/>
    </linearGradient>

    <!-- OR -->
    <linearGradient id="gold">
        <stop offset="0%" stop-color="#50320b"/>
        <stop offset="20%" stop-color="#9c6717"/>
        <stop offset="48%" stop-color="#d1a33c"/>
        <stop offset="70%" stop-color="#936016"/>
        <stop offset="100%" stop-color="#392307"/>
    </linearGradient>

    <!-- TEXTURE DE PIERRE -->
    <filter id="roughStone">

        <feTurbulence
            type="fractalNoise"
            baseFrequency=".025"
            numOctaves="4"
            seed="8"
            result="noise"/>

        <feDiffuseLighting
            in="noise"
            lighting-color="#888579"
            surfaceScale="4"
            result="light">

            <feDistantLight
                azimuth="225"
                elevation="38"/>

        </feDiffuseLighting>

        <feBlend
            in="SourceGraphic"
            in2="light"
            mode="multiply"/>

    </filter>


    <!-- LUEUR PORTE -->
    <filter id="goldGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

        <feGaussianBlur
            stdDeviation="18"
            result="blur"/>

        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>

    </filter>


    <!-- OMBRE -->
    <filter id="shadow"
            x="-30%"
            y="-30%"
            width="160%"
            height="160%">

        <feDropShadow
            dx="0"
            dy="15"
            stdDeviation="20"
            flood-color="#000"
            flood-opacity=".9"/>

    </filter>

</defs>
