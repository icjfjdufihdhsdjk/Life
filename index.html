<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIFE</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

canvas {
    display: block;
}
</style>
</head>

<body>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
}
</script>

<script type="module">

import * as THREE from "three";


/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x000000);

scene.fog = new THREE.FogExp2(
    0x000000,
    0.018
);


/* =========================================================
   CAMERA
========================================================= */

const camera = new THREE.PerspectiveCamera(
    42,
    innerWidth / innerHeight,
    0.1,
    300
);

/*
    Très bas devant le monument.
    La caméra regarde vers le haut.
*/

camera.position.set(
    0,
    2.2,
    31
);

camera.lookAt(
    0,
    13,
    0
);


/* =========================================================
   RENDERER
========================================================= */

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    0.72;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   MATERIAUX
========================================================= */

const stone = new THREE.MeshStandardMaterial({
    color: 0x34342f,
    roughness: 0.96,
    metalness: 0
});

const stoneDark = new THREE.MeshStandardMaterial({
    color: 0x1c1d1a,
    roughness: 1
});

const stoneLight = new THREE.MeshStandardMaterial({
    color: 0x4b4942,
    roughness: 0.94
});

const deepBlack = new THREE.MeshStandardMaterial({
    color: 0x050605,
    roughness: 1
});

const gold = new THREE.MeshStandardMaterial({
    color: 0xb98124,
    roughness: 0.32,
    metalness: 0.78
});

const darkGold = new THREE.MeshStandardMaterial({
    color: 0x67400d,
    roughness: 0.48,
    metalness: 0.65
});


/* =========================================================
   MONUMENT
========================================================= */

const monument = new THREE.Group();

scene.add(monument);


/* =========================================================
   OUTILS
========================================================= */

function box(
    w,
    h,
    d,
    x,
    y,
    z,
    material = stone,
    parent = monument
) {

    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(
            w,
            h,
            d
        ),
        material
    );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    parent.add(mesh);

    return mesh;
}


function cylinder(
    radius,
    height,
    x,
    y,
    z,
    material = stone
) {

    const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(
            radius,
            radius * 1.05,
            height,
            20
        ),
        material
    );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    monument.add(mesh);

    return mesh;
}


/* =========================================================
   GRANDE MASSE ARRIERE
========================================================= */

box(
    17,
    24,
    4,
    0,
    12,
    0,
    stoneDark
);


/* =========================================================
   AILES LATERALES
========================================================= */

box(
    5.4,
    18,
    5,
    -9.1,
    9,
    0.4,
    stoneDark
);

box(
    5.4,
    18,
    5,
    9.1,
    9,
    0.4,
    stoneDark
);


/* =========================================================
   CONTREFORTS EXTERIEURS
========================================================= */

function createOuterButtress(x) {

    box(
        2.2,
        16,
        4,
        x,
        8,
        2,
        stone
    );

    box(
        2.8,
        0.8,
        4.6,
        x,
        2,
        2.1,
        stoneLight
    );

    box(
        2.8,
        0.8,
        4.6,
        x,
        7,
        2.1,
        stoneLight
    );

    box(
        2.8,
        0.8,
        4.6,
        x,
        12,
        2.1,
        stoneLight
    );

    box(
        3.2,
        1,
        5,
        x,
        16,
        2.1,
        stoneLight
    );

}

createOuterButtress(-10.5);
createOuterButtress(10.5);


/* =========================================================
   CONTREFORTS CENTRAUX
========================================================= */

function centralButtress(x) {

    box(
        1.7,
        14,
        3.5,
        x,
        7,
        2.8,
        stone
    );

    box(
        2.5,
        0.7,
        4,
        x,
        2.1,
        2.9,
        stoneLight
    );

    box(
        2.3,
        0.6,
        4,
        x,
        8,
        2.9,
        stoneLight
    );

    box(
        2.6,
        0.8,
        4,
        x,
        13.8,
        2.9,
        stoneLight
    );

}

centralButtress(-5.1);
centralButtress(5.1);


/* =========================================================
   PETITES NICHES LATERALES
========================================================= */

function niche(x, y) {

    box(
        1.8,
        2.8,
        0.25,
        x,
        y,
        2.95,
        deepBlack
    );

    box(
        2.3,
        0.28,
        0.55,
        x,
        y + 1.55,
        3.1,
        stoneLight
    );

    box(
        2.3,
        0.28,
        0.55,
        x,
        y - 1.55,
        3.1,
        stoneLight
    );

}

for (
    const x of [-7.7, 7.7]
) {

    niche(x, 4.5);
    niche(x, 8.5);
    niche(x, 12.5);

}


/* =========================================================
   GRANDE GALERIE HORIZONTALE
========================================================= */

box(
    20,
    1,
    5,
    0,
    15.6,
    1,
    stoneLight
);

box(
    22,
    0.55,
    5.8,
    0,
    16.3,
    1,
    stone
);


/* ouvertures galerie */

for (
    let x = -8;
    x <= 8;
    x += 2
) {

    box(
        0.9,
        1.6,
        0.25,
        x,
        17.5,
        2.4,
        deepBlack
    );

}


/* étage galerie */

box(
    18,
    3,
    4.5,
    0,
    17.5,
    0.5,
    stoneDark
);


/* =========================================================
   SECOND NIVEAU
========================================================= */

box(
    14,
    4,
    4,
    0,
    21,
    0.3,
    stone
);

box(
    16,
    0.7,
    4.8,
    0,
    19,
    0.6,
    stoneLight
);

box(
    16,
    0.7,
    4.8,
    0,
    23,
    0.6,
    stoneLight
);


/* fenêtres supérieures */

for (
    let x = -5;
    x <= 5;
    x += 2.5
) {

    box(
        1.1,
        2,
        0.2,
        x,
        21,
        2.45,
        deepBlack
    );

}


/* =========================================================
   TOUR CENTRALE
========================================================= */

box(
    9,
    4,
    3.5,
    0,
    25,
    0,
    stoneDark
);

box(
    11,
    0.8,
    4.2,
    0,
    23.5,
    0.4,
    stoneLight
);

box(
    11,
    0.8,
    4.2,
    0,
    27,
    0.4,
    stoneLight
);


/* =========================================================
   SOMMET
========================================================= */

box(
    7,
    2.2,
    3.2,
    0,
    28.5,
    0,
    stone
);

box(
    5,
    2,
    2.8,
    0,
    30.5,
    0,
    stoneDark
);

box(
    3,
    2,
    2.5,
    0,
    32.3,
    0,
    stone
);


/*
    Point central supérieur
*/

const crownGeometry =
    new THREE.ConeGeometry(
        1.3,
        4,
        4
    );

const crown =
    new THREE.Mesh(
        crownGeometry,
        stoneLight
    );

crown.position.set(
    0,
    35,
    0
);

crown.rotation.y =
    Math.PI / 4;

crown.castShadow = true;

monument.add(crown);


/* =========================================================
   PETITS RELIEFS POUR CASSER LE COTE CUBIQUE
========================================================= */

for (
    const side of [-1, 1]
) {

    for (
        let y = 3;
        y < 15;
        y += 2.2
    ) {

        box(
            1.1,
            0.45,
            1.4,
            side * 8.6,
            y,
            3,
            stoneLight
        );

    }

}


/* =========================================================
   COLONNES DEVANT LA PORTE
========================================================= */

function frontColumn(x) {

    cylinder(
        0.6,
        10,
        x,
        6.5,
        4.2,
        stoneLight
    );

    box(
        1.7,
        0.7,
        1.7,
        x,
        1.4,
        4.2,
        stone
    );

    box(
        1.7,
        0.7,
        1.7,
        x,
        11.6,
        4.2,
        stone
    );

}

frontColumn(-3.7);
frontColumn(3.7);


/* =========================================================
   ENCASTREMENT DE LA PORTE
========================================================= */

box(
    8.5,
    12,
    2,
    0,
    6.5,
    2.4,
    stoneDark
);


/* montants */

box(
    1.1,
    11,
    2,
    -3.4,
    6.5,
    4,
    stoneLight
);

box(
    1.1,
    11,
    2,
    3.4,
    6.5,
    4,
    stoneLight
);


/* linteaux successifs */

box(
    8,
    0.75,
    2.2,
    0,
    12,
    4,
    stoneLight
);

box(
    9,
    0.6,
    2.4,
    0,
    12.8,
    3.8,
    stone
);

box(
    10,
    0.5,
    2.6,
    0,
    13.5,
    3.5,
    stoneLight
);


/* =========================================================
   PORTE DOREE
========================================================= */

const doors = new THREE.Group();

doors.position.set(
    0,
    1.5,
    5.1
);

monument.add(doors);


function createDoor(side) {

    const pivot =
        new THREE.Group();

    const geo =
        new THREE.BoxGeometry(
            2.65,
            9.5,
            0.28
        );

    const mesh =
        new THREE.Mesh(
            geo,
            gold
        );

    mesh.castShadow = true;


    /*
        Le mesh est décalé depuis sa charnière.
    */

    if (side < 0) {

        mesh.position.x =
            1.325;

        pivot.position.x =
            -2.65;

    } else {

        mesh.position.x =
            -1.325;

        pivot.position.x =
            2.65;

    }


    pivot.add(mesh);

    doors.add(pivot);


    /*
        Reliefs verticaux
    */

    for (
        let i = -0.8;
        i <= 0.8;
        i += 0.8
    ) {

        const line =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    0.09,
                    8.7,
                    0.10
                ),
                darkGold
            );

        line.position.set(
            side < 0
                ? 1.325 + i
                : -1.325 + i,
            0,
            0.2
        );

        pivot.add(line);

    }


    /*
        Reliefs horizontaux
    */

    for (
        let y = -3.5;
        y <= 3.5;
        y += 1.75
    ) {

        const line =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    2.3,
                    0.10,
                    0.10
                ),
                darkGold
            );

        line.position.set(
            side < 0
                ? 1.325
                : -1.325,
            y,
            0.2
        );

        pivot.add(line);

    }


    return pivot;

}


const leftDoor =
    createDoor(-1);

const rightDoor =
    createDoor(1);


/* =========================================================
   JOINT CENTRAL LUMINEUX
========================================================= */

const seamMaterial =
    new THREE.MeshBasicMaterial({
        color: 0xffc95a
    });

const seam =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            0.06,
            9,
            0.08
        ),
        seamMaterial
    );

seam.position.set(
    0,
    6,
    5.35
);

monument.add(seam);


/* =========================================================
   ESCALIERS
========================================================= */

for (
    let i = 0;
    i < 7;
    i++
) {

    box(
        12 + i * 1.2,
        0.35,
        1.7,
        0,
        0.2 - i * 0.25,
        5.5 + i * 0.85,
        stoneDark
    );

}


/* =========================================================
   SOL
========================================================= */

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            150,
            150
        ),
        new THREE.MeshStandardMaterial({
            color: 0x050605,
            roughness: 1
        })
    );

ground.rotation.x =
    -Math.PI / 2;

ground.position.y =
    -1.5;

ground.receiveShadow = true;

scene.add(ground);


/* =========================================================
   LUMIERES
========================================================= */

/*
    Très peu de lumière générale.
*/

scene.add(
    new THREE.HemisphereLight(
        0x343931,
        0x000000,
        0.28
    )
);


/*
    Lumière froide venant du haut.
*/

const topLight =
    new THREE.DirectionalLight(
        0xaaa994,
        1.7
    );

topLight.position.set(
    -7,
    25,
    15
);

topLight.castShadow = true;

scene.add(topLight);


/*
    Porte dorée.
*/

const doorLight =
    new THREE.PointLight(
        0xffa92d,
        85,
        20,
        2
    );

doorLight.position.set(
    0,
    6,
    8
);

scene.add(doorLight);


/*
    Petite lumière très chaude au ras du sol.
*/

const floorLight =
    new THREE.PointLight(
        0xcf791e,
        25,
        17
    );

floorLight.position.set(
    0,
    1,
    10
);

scene.add(floorLight);


/* =========================================================
   OUVERTURE
========================================================= */

let opening = false;

let progress = 0;


renderer.domElement.addEventListener(
    "click",
    () => {

        if (!opening) {

            opening = true;

        }

    }
);


/* =========================================================
   ANIMATION
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    if (
        opening &&
        progress < 1
    ) {

        progress += 0.004;


        const eased =
            1 -
            Math.pow(
                1 - progress,
                3
            );


        leftDoor.rotation.y =
            -eased * 1.62;


        rightDoor.rotation.y =
            eased * 1.62;


        seam.material.opacity =
            1 - eased;


        doorLight.intensity =
            85 +
            eased * 120;

    }


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>

</body>
</html>
