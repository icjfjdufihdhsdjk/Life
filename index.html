<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LIFE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="noise"></div>

    <main class="landing">

        <div class="top">
            <span>LIFE</span>
            <span>01 / 04</span>
        </div>

        <section class="center">

            <p class="eyebrow">LIVING INFORMATION FRAMEWORK ENVIRONMENT</p>

            <h1>LIFE</h1>

            <p class="quote">
                An environment is considered alive<br>
                when it begins to behave independently.
            </p>

            <button id="enter">
                <span>ENTER</span>
                <span class="arrow">→</span>
            </button>

        </section>

        <div class="bottom">
            <span>PROJECT STATUS</span>
            <span class="status">
                <i></i>
                ACTIVE
            </span>
        </div>

    </main>


    <section id="world" class="world">

        <div class="world-header">
            <span>LIFE</span>
            <span>ENVIRONMENT 01</span>
        </div>

        <div class="world-content">

            <p class="small">ENVIRONMENT 01</p>

            <h2>THE KINGDOM</h2>

            <p>
                An artificial environment currently under observation.
            </p>

            <div class="line"></div>

            <button id="return">RETURN</button>

        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
