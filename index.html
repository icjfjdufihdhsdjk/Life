<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIFE</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }

    canvas {
        display: block;
    }
</style>
</head>

<body>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
}
</script>

<script type="module">

import * as THREE from "three";

/* =========================================
   SCÈNE
========================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.025);


/* =========================================
   CAMÉRA
========================================= */

const camera = new THREE.PerspectiveCamera(
    48,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 4, 22);

/*
    La caméra regarde vers le haut :
    le monument doit nous dominer.
*/

camera.lookAt(0, 9, 0);


/* =========================================
   RENDERER
========================================= */

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 0.75;

document.body.appendChild(
    renderer.domElement
);


/* =========================================
   MATÉRIAUX
========================================= */

const stone = new THREE.MeshStandardMaterial({
    color: 0x292822,
    roughness: 0.92,
    metalness: 0.03
});


const darkStone = new THREE.MeshStandardMaterial({
    color: 0x161713,
    roughness: 1
});


const gold = new THREE.MeshStandardMaterial({
    color: 0x9b681c,
    roughness: 0.42,
    metalness: 0.72
});


/* =========================================
   OUTIL POUR CRÉER UN BLOC
========================================= */

function block(
    width,
    height,
    depth,
    x,
    y,
    z,
    material = stone
) {

    const geometry =
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);

    return mesh;
}


/* =========================================
   MASSE PRINCIPALE DU MONUMENT
========================================= */

block(
    14,
    17,
    3,
    0,
    8.5,
    0
);


/* masses latérales */

block(
    4,
    13,
    4,
    -8,
    6.5,
    0.5,
    darkStone
);

block(
    4,
    13,
    4,
    8,
    6.5,
    0.5,
    darkStone
);


/* =========================================
   ÉTAGES SUPÉRIEURS
========================================= */

block(
    16,
    1,
    4,
    0,
    14,
    0.3
);

block(
    12,
    4,
    3.5,
    0,
    16.5,
    0
);

block(
    14,
    0.7,
    4,
    0,
    18.6,
    0.2
);

block(
    8,
    3,
    3,
    0,
    20.3,
    0
);


/* =========================================
   PILIERS
========================================= */

function pillar(x) {

    const geometry =
        new THREE.CylinderGeometry(
            0.8,
            1,
            10,
            20
        );

    const mesh =
        new THREE.Mesh(
            geometry,
            stone
        );

    mesh.position.set(
        x,
        6,
        2.3
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);


    /* base */

    block(
        2.4,
        0.7,
        2.4,
        x,
        1,
        2.3
    );


    /* chapiteau */

    block(
        2.2,
        0.7,
        2.2,
        x,
        11,
        2.3
    );

}

pillar(-5.2);
pillar(5.2);


/* =========================================
   ENCADREMENT DE LA PORTE
========================================= */

block(
    1.1,
    9,
    1.4,
    -3.3,
    5,
    2.2
);

block(
    1.1,
    9,
    1.4,
    3.3,
    5,
    2.2
);

block(
    7.7,
    1,
    1.5,
    0,
    9.5,
    2.2
);


/* =========================================
   PORTE
========================================= */

const doorGroup =
    new THREE.Group();

scene.add(doorGroup);


const doorGeometry =
    new THREE.BoxGeometry(
        3,
        8,
        0.35
    );


const leftDoor =
    new THREE.Mesh(
        doorGeometry,
        gold
    );

leftDoor.position.set(
    -1.5,
    5,
    2.7
);

leftDoor.castShadow = true;


const rightDoor =
    new THREE.Mesh(
        doorGeometry,
        gold
    );

rightDoor.position.set(
    1.5,
    5,
    2.7
);

rightDoor.castShadow = true;


doorGroup.add(leftDoor);
doorGroup.add(rightDoor);


/* reliefs verticaux */

for (
    let x = -2.5;
    x <= 2.5;
    x += 1
) {

    block(
        0.12,
        7.4,
        0.18,
        x,
        5,
        2.95,
        gold
    );

}


/* =========================================
   ESCALIERS
========================================= */

for (
    let i = 0;
    i < 6;
    i++
) {

    block(
        12 + i * 1.3,
        0.35,
        2,
        0,
        0.15 - i * 0.25,
        3.8 + i * 1.1,
        darkStone
    );

}


/* =========================================
   SOL
========================================= */

const floor =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            100,
            100
        ),
        new THREE.MeshStandardMaterial({
            color: 0x090a08,
            roughness: 1
        })
    );

floor.rotation.x =
    -Math.PI / 2;

floor.position.y =
    -1.5;

floor.receiveShadow = true;

scene.add(floor);


/* =========================================
   ÉCLAIRAGE GÉNÉRAL
========================================= */

const ambient =
    new THREE.HemisphereLight(
        0x25271f,
        0x050505,
        0.35
    );

scene.add(ambient);


/* =========================================
   LUMIÈRE DORÉE DE LA PORTE
========================================= */

const doorLight =
    new THREE.PointLight(
        0xffb632,
        70,
        20,
        2
    );

doorLight.position.set(
    0,
    5,
    5
);

doorLight.castShadow = true;

scene.add(doorLight);


/* lumière supérieure très faible */

const moonLight =
    new THREE.DirectionalLight(
        0x9ca7a0,
        1.1
    );

moonLight.position.set(
    -5,
    18,
    10
);

moonLight.castShadow = true;

scene.add(moonLight);


/* =========================================
   OUVERTURE
========================================= */

let opening = false;
let progress = 0;

renderer.domElement.addEventListener(
    "click",
    () => {

        if (!opening) {
            opening = true;
        }

    }
);


/* =========================================
   ANIMATION
========================================= */

function animate() {

    requestAnimationFrame(animate);


    if (opening && progress < 1) {

        progress += 0.006;

        const eased =
            1 -
            Math.pow(
                1 - progress,
                3
            );

        leftDoor.rotation.y =
            eased * 1.45;

        rightDoor.rotation.y =
            -eased * 1.45;

        doorLight.intensity =
            70 + eased * 100;

    }


    renderer.render(
        scene,
        camera
    );

}

animate();


/* =========================================
   RESIZE
========================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
