<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIFE</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background: #020303;
}


/* ============================
   SCÈNE
============================ */

.scene {
    position: relative;

    width: 100vw;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: flex-end;

    perspective: 1600px;

    background:
        radial-gradient(
            ellipse at 50% 80%,
            #10110f 0%,
            #060706 28%,
            #020303 60%,
            #000 100%
        );
}


/* brume très légère au sol */

.scene::after {
    content: "";

    position: absolute;

    bottom: -80px;
    left: 50%;

    width: 900px;
    height: 250px;

    transform: translateX(-50%);

    background:
        radial-gradient(
            ellipse,
            rgba(150, 140, 100, .12),
            transparent 65%
        );

    filter: blur(30px);

    pointer-events: none;
}



/* ============================
   TEMPLE
============================ */

.temple {

    position: relative;

    width: min(920px, 90vw);
    height: min(900px, 95vh);

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;

    filter:
        drop-shadow(0 0 20px rgba(0,0,0,.9))
        drop-shadow(0 25px 35px rgba(0,0,0,.9));

}


/* ============================
   SOMMET
============================ */

.crown {

    position: absolute;

    top: 2%;

    width: 66%;
    height: 180px;

    background:
        linear-gradient(
            90deg,
            #171712,
            #373329,
            #25231d,
            #3d382d,
            #151511
        );

    clip-path: polygon(
        7% 100%,
        12% 62%,
        22% 58%,
        29% 31%,
        40% 27%,
        50% 5%,
        60% 27%,
        71% 31%,
        78% 58%,
        88% 62%,
        93% 100%
    );

    border-bottom: 8px solid #484238;
}


.crown::after {

    content: "";

    position: absolute;

    left: 50%;
    top: 38%;

    width: 90px;
    height: 90px;

    transform:
        translateX(-50%)
        rotate(45deg);

    border: 5px solid #5e5748;

    opacity: .65;

}



/* ============================
   ÉTAGE SUPÉRIEUR
============================ */

.upper {

    position: absolute;

    top: 17%;

    width: 78%;
    height: 190px;

    background:
        repeating-linear-gradient(
            90deg,
            #25241e 0 55px,
            #302e26 55px 110px
        );

    border:
        7px solid #444137;

    box-shadow:
        inset 0 -25px 30px rgba(0,0,0,.65);

}


.upper::before {

    content: "";

    position: absolute;

    top: 30px;
    left: 6%;

    width: 88%;
    height: 60px;

    background:
        repeating-linear-gradient(
            90deg,
            #080908 0 25px,
            #353229 25px 42px,
            #080908 42px 67px
        );

    border-top: 5px solid #4c483d;
    border-bottom: 5px solid #4c483d;

}



/* ============================
   BANDEAU CENTRAL
============================ */

.band {

    position: absolute;

    top: 34%;

    width: 88%;
    height: 70px;

    background:
        linear-gradient(
            #504a3d,
            #24231e 35%,
            #171713 65%,
            #514b3e
        );

    border-top: 6px solid #666054;
    border-bottom: 7px solid #343129;

}

.band::after {

    content: "";

    position: absolute;

    inset: 18px 5%;

    border-top: 2px solid #71684d;
    border-bottom: 2px solid #71684d;

}



/* ============================
   CORPS PRINCIPAL
============================ */

.main-building {

    position: absolute;

    bottom: 0;

    width: 82%;
    height: 61%;

    background:

        repeating-linear-gradient(
            0deg,
            transparent 0 37px,
            rgba(255,255,255,.025) 38px 40px
        ),

        repeating-linear-gradient(
            90deg,
            transparent 0 52px,
            rgba(0,0,0,.17) 52px 56px
        ),

        linear-gradient(
            90deg,
            #1b1c19,
            #38362e 18%,
            #23231f 50%,
            #39372f 82%,
            #191a17
        );

    border-left: 9px solid #48463e;
    border-right: 9px solid #48463e;

}



/* ============================
   COLONNES
============================ */

.column {

    position: absolute;

    bottom: 4%;

    width: 86px;
    height: 52%;

    background:

        linear-gradient(
            90deg,
            #171815,
            #56534a,
            #2a2a25,
            #5a564b,
            #171815
        );

    border: 5px solid #555249;

}


.column::before,
.column::after {

    content: "";

    position: absolute;

    left: -15px;

    width: calc(100% + 30px);

    height: 25px;

    background: #4b4941;

    border-top: 4px solid #656157;
    border-bottom: 4px solid #2a2925;

}

.column::before {
    top: -12px;
}

.column::after {
    bottom: -12px;
}


.column.left {
    left: 16%;
}

.column.right {
    right: 16%;
}



/* ============================
   STRUCTURE AUTOUR DE LA PORTE
============================ */

.portal-frame {

    position: absolute;

    bottom: 3%;

    width: 390px;
    height: 500px;

    background:
        linear-gradient(
            90deg,
            #424139,
            #777267,
            #34342f,
            #787267,
            #403f38
        );

    padding: 35px;

    box-shadow:
        0 0 30px rgba(0,0,0,.9);

}


.portal-frame::before {

    content: "";

    position: absolute;

    left: -25px;
    top: -25px;

    width: calc(100% + 50px);
    height: 35px;

    background:
        linear-gradient(
            #6c675c,
            #35342f
        );

    border-top: 4px solid #827d71;

}



/* ============================
   LUMIÈRE DERRIÈRE
============================ */

.portal-light {

    position: absolute;

    bottom: 4%;

    width: 250px;
    height: 410px;

    background:
        linear-gradient(
            90deg,
            #5e3a0c,
            #d59d32,
            #fff0a5,
            #d59d32,
            #5e3a0c
        );

    opacity: .3;

    filter: blur(25px);

    transition:
        opacity 4s ease,
        width 4s ease;

}



/* ============================
   PORTES
============================ */

.doors {

    position: absolute;

    inset: 35px;

    display: flex;

    perspective: 1200px;

    overflow: visible;

}


.door {

    position: relative;

    width: 50%;
    height: 100%;

    background:

        repeating-linear-gradient(
            90deg,
            transparent 0 29px,
            rgba(255,235,150,.09) 30px 33px
        ),

        repeating-linear-gradient(
            0deg,
            transparent 0 45px,
            rgba(80,45,5,.3) 46px 49px
        ),

        linear-gradient(
            90deg,
            #6c400b,
            #b97d19,
            #d7a936,
            #82500d
        );

    border: 4px solid #8d6825;

    box-shadow:
        inset 0 0 35px rgba(55,30,0,.9);

    transition:
        transform 4.5s cubic-bezier(.2,.7,.05,1);

}


.door-left {

    transform-origin: left center;

}


.door-right {

    transform-origin: right center;

}



/* ornements */

.door::before {

    content: "";

    position: absolute;

    inset: 22px;

    border: 3px solid rgba(255,220,120,.38);

}


.door::after {

    content: "";

    position: absolute;

    left: 50%;
    top: 13%;

    width: 45%;
    height: 74%;

    transform: translateX(-50%);

    border-left: 3px solid rgba(255,225,130,.28);
    border-right: 3px solid rgba(255,225,130,.28);

}



/* ============================
   JOINT CENTRAL
============================ */

.seal {

    position: absolute;

    left: 50%;
    top: 35px;

    width: 8px;
    height: calc(100% - 70px);

    transform: translateX(-50%);

    background:
        linear-gradient(
            #70501e,
            #efc253,
            #70501e
        );

    z-index: 5;

    box-shadow:
        0 0 10px rgba(255,190,60,.25);

    transition: opacity 1s ease;

}



/* ============================
   SOCLE
============================ */

.base {

    position: absolute;

    bottom: -45px;

    width: 100%;
    height: 90px;

    background:
        linear-gradient(
            #3a3933,
            #151614
        );

    clip-path: polygon(
        5% 0,
        95% 0,
        100% 100%,
        0 100%
    );

    border-top: 5px solid #555249;

}



/* ============================
   OUVERTURE
============================ */

.temple.open .door-left {
    transform: rotateY(-112deg);
}

.temple.open .door-right {
    transform: rotateY(112deg);
}

.temple.open .seal {
    opacity: 0;
}

.temple.open .portal-light {
    opacity: .95;
    width: 410px;
}



/* ============================
   RESPONSIVE
============================ */

@media (max-width: 650px) {

    .portal-frame {
        width: 270px;
        height: 390px;
    }

    .column {
        width: 60px;
    }

}

</style>
</head>


<body>


<div class="scene">


    <div class="temple" id="temple">


        <div class="crown"></div>

        <div class="upper"></div>

        <div class="band"></div>

        <div class="main-building"></div>


        <div class="column left"></div>

        <div class="column right"></div>


        <div class="portal-light"></div>


        <div class="portal-frame">


            <div class="doors">


                <div class="door door-left"></div>

                <div class="door door-right"></div>


            </div>


            <div class="seal"></div>


        </div>


        <div class="base"></div>


    </div>


</div>



<script>

const temple = document.getElementById("temple");

let opened = false;


temple.addEventListener("click", () => {

    if (opened) return;

    opened = true;

    temple.classList.add("open");

});

</script>


</body>
</html>
