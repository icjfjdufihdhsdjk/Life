<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ma Cinéthèque</title>

  <style>
    :root {
      --background: #0b0d12;
      --card: #151922;
      --card-hover: #1c2230;
      --border: #252b37;
      --text: #f4f4f5;
      --muted: #9ca3af;
      --accent: #7c5cff;
      --accent-hover: #9278ff;
      --danger: #ff5c6c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(124, 92, 255, 0.15), transparent 30%),
        var(--background);
      color: var(--text);
    }

    header {
      max-width: 1300px;
      margin: auto;
      padding: 40px 25px 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 8px;
    }

    header p {
      color: var(--muted);
    }

    main {
      max-width: 1300px;
      margin: auto;
      padding: 20px 25px 60px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 12px;
      margin-bottom: 30px;
    }

    input,
    select,
    textarea,
    button {
      font: inherit;
    }

    input,
    select,
    textarea {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 13px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
    }

    button {
      border: none;
      cursor: pointer;
    }

    .primary-button {
      background: var(--accent);
      color: white;
      padding: 13px 18px;
      border-radius: 12px;
      font-weight: bold;
    }

    .primary-button:hover {
      background: var(--accent-hover);
    }

    .library {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 24px;
    }

    .empty-library {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      padding: 100px 20px;
      border: 1px dashed var(--border);
      border-radius: 18px;
    }

    .empty-library h2 {
      color: var(--text);
      margin-bottom: 10px;
    }

    .media-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: 0.2s;
      cursor: pointer;
    }

    .media-card:hover {
      transform: translateY(-5px);
      background: var(--card-hover);
    }

    .poster {
      aspect-ratio: 2 / 3;
      background: #202532;
      position: relative;
      overflow: hidden;
    }

    .poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .poster-placeholder {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      font-size: 48px;
    }

    .type-badge {
      position: absolute;
      left: 10px;
      top: 10px;
      background: rgba(0, 0, 0, 0.75);
      padding: 6px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
    }

    .rating {
      position: absolute;
      right: 10px;
      bottom: 10px;
      background: rgba(0, 0, 0, 0.8);
      padding: 6px 9px;
      border-radius: 8px;
      font-size: 13px;
    }

    .card-content {
      padding: 14px;
    }

    .card-title {
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 8px;
    }

    .card-info {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 13px;
    }

    dialog {
      width: min(600px, calc(100% - 30px));
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--card);
      color: var(--text);
      margin: auto;
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.75);
    }

    .modal-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .close-button {
      background: #242a36;
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 10px;
    }

    form {
      padding: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      color: var(--muted);
      font-size: 13px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .form-actions {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .secondary-button {
      background: #252b37;
      color: white;
      padding: 12px 16px;
      border-radius: 10px;
    }

    .delete-button {
      background: rgba(255, 92, 108, 0.12);
      color: var(--danger);
      padding: 12px 16px;
      border-radius: 10px;
      margin-right: auto;
    }

    @media (max-width: 700px) {
      .toolbar {
        grid-template-columns: 1fr 1fr;
      }

      .search-input {
        grid-column: 1 / -1;
      }

      .add-button {
        grid-column: 1 / -1;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Ma Cinéthèque</h1>
  <p>Ma bibliothèque personnelle de films et séries.</p>
</header>

<main>

  <div class="toolbar">

    <input
      id="search"
      class="search-input"
      type="text"
      placeholder="Rechercher..."
    />

    <select id="typeFilter">
      <option value="all">Tout</option>
      <option value="Film">Films</option>
      <option value="Série">Séries</option>
    </select>

    <select id="statusFilter">
      <option value="all">Tous les statuts</option>
      <option value="Vu">Vu</option>
      <option value="En cours">En cours</option>
      <option value="À revoir">À revoir</option>
      <option value="Abandonné">Abandonné</option>
    </select>

    <button
      id="addButton"
      class="primary-button add-button"
    >
      + Ajouter
    </button>

  </div>

  <section
    id="library"
    class="library"
  ></section>

</main>

<dialog id="mediaDialog">

  <div class="modal-header">

    <h2 id="dialogTitle">
      Ajouter
    </h2>

    <button
      id="closeDialog"
      class="close-button"
    >
      ✕
    </button>

  </div>

  <form id="mediaForm">

    <div class="form-grid">

      <div class="form-group full">

        <label for="title">
          Titre
        </label>

        <input
          id="title"
          required
        />

      </div>

      <div class="form-group">

        <label for="type">
          Type
        </label>

        <select id="type">
          <option value="Film">Film</option>
          <option value="Série">Série</option>
        </select>

      </div>

      <div class="form-group">

        <label for="year">
          Année
        </label>

        <input
          id="year"
          type="number"
          min="1900"
          max="2100"
        />

      </div>

      <div class="form-group">

        <label for="status">
          Statut
        </label>

        <select id="status">
          <option value="Vu">Vu</option>
          <option value="En cours">En cours</option>
          <option value="À revoir">À revoir</option>
          <option value="Abandonné">Abandonné</option>
        </select>

      </div>

      <div class="form-group">

        <label for="rating">
          Note /10
        </label>

        <input
          id="rating"
          type="number"
          min="0"
          max="10"
          step="0.5"
        />

      </div>

      <div class="form-group full">

        <label for="poster">
          URL de l'affiche
        </label>

        <input
          id="poster"
          type="url"
          placeholder="https://..."
        />

      </div>

      <div class="form-group full">

        <label for="review">
          Mon avis
        </label>

        <textarea
          id="review"
          placeholder="Ton avis..."
        ></textarea>

      </div>

    </div>

    <div class="form-actions">

      <button
        id="deleteButton"
        type="button"
        class="delete-button"
        hidden
      >
        Supprimer
      </button>

      <button
        id="cancelButton"
        type="button"
        class="secondary-button"
      >
        Annuler
      </button>

      <button
        type="submit"
        class="primary-button"
      >
        Enregistrer
      </button>

    </div>

  </form>

</dialog>

<script>

const STORAGE_KEY = "myMovieLibrary";

let library =
  JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

let editingId = null;

const libraryElement =
  document.getElementById("library");

const searchInput =
  document.getElementById("search");

const typeFilter =
  document.getElementById("typeFilter");

const statusFilter =
  document.getElementById("statusFilter");

const dialog =
  document.getElementById("mediaDialog");

const form =
  document.getElementById("mediaForm");

const deleteButton =
  document.getElementById("deleteButton");

function saveLibrary() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(library)
  );

}

function renderLibrary() {

  const search =
    searchInput.value.toLowerCase();

  const type =
    typeFilter.value;

  const status =
    statusFilter.value;

  const filteredLibrary =
    library.filter(item => {

      const matchTitle =
        item.title
          .toLowerCase()
          .includes(search);

      const matchType =
        type === "all" ||
        item.type === type;

      const matchStatus =
        status === "all" ||
        item.status === status;

      return (
        matchTitle &&
        matchType &&
        matchStatus
      );

    });

  libraryElement.innerHTML = "";

  if (filteredLibrary.length === 0) {

    libraryElement.innerHTML = `
      <div class="empty-library">

        <h2>Ta bibliothèque est vide</h2>

        <p>
          Ajoute ton premier film ou ta première série.
        </p>

      </div>
    `;

    return;

  }

  filteredLibrary.forEach(item => {

    const card =
      document.createElement("article");

    card.className =
      "media-card";

    card.innerHTML = `

      <div class="poster">

        ${
          item.poster
          ? `
            <img
              src="${item.poster}"
              alt="${item.title}"
            />
          `
          : `
            <div class="poster-placeholder">
              🎬
            </div>
          `
        }

        <span class="type-badge">
          ${item.type}
        </span>

        <span class="rating">
          ★ ${item.rating || "-"} / 10
        </span>

      </div>

      <div class="card-content">

        <div class="card-title">
          ${item.title}
        </div>

        <div class="card-info">

          <span>
            ${item.year || "Année inconnue"}
          </span>

          <span>•</span>

          <span>
            ${item.status}
          </span>

        </div>

      </div>
    `;

    card.addEventListener(
      "click",
      () => openEditDialog(item.id)
    );

    libraryElement.appendChild(card);

  });

}

function openAddDialog() {

  editingId = null;

  form.reset();

  document.getElementById(
    "dialogTitle"
  ).textContent =
    "Ajouter un film ou une série";

  deleteButton.hidden = true;

  dialog.showModal();

}

function openEditDialog(id) {

  const item =
    library.find(
      item => item.id === id
    );

  if (!item) return;

  editingId = id;

  document.getElementById(
    "dialogTitle"
  ).textContent =
    "Modifier";

  document.getElementById(
    "title"
  ).value =
    item.title;

  document.getElementById(
    "type"
  ).value =
    item.type;

  document.getElementById(
    "year"
  ).value =
    item.year;

  document.getElementById(
    "status"
  ).value =
    item.status;

  document.getElementById(
    "rating"
  ).value =
    item.rating;

  document.getElementById(
    "poster"
  ).value =
    item.poster;

  document.getElementById(
    "review"
  ).value =
    item.review;

  deleteButton.hidden = false;

  dialog.showModal();

}

form.addEventListener(
  "submit",
  event => {

    event.preventDefault();

    const item = {

      id:
        editingId ||
        crypto.randomUUID(),

      title:
        document
          .getElementById("title")
          .value
          .trim(),

      type:
        document
          .getElementById("type")
          .value,

      year:
        document
          .getElementById("year")
          .value,

      status:
        document
          .getElementById("status")
          .value,

      rating:
        document
          .getElementById("rating")
          .value,

      poster:
        document
          .getElementById("poster")
          .value
          .trim(),

      review:
        document
          .getElementById("review")
          .value
          .trim()

    };

    if (editingId) {

      library =
        library.map(oldItem =>
          oldItem.id === editingId
            ? item
            : oldItem
        );

    } else {

      library.unshift(item);

    }

    saveLibrary();

    dialog.close();

    renderLibrary();

  }
);

deleteButton.addEventListener(
  "click",
  () => {

    library =
      library.filter(
        item =>
          item.id !== editingId
      );

    saveLibrary();

    dialog.close();

    renderLibrary();

  }
);

document
  .getElementById("addButton")
  .addEventListener(
    "click",
    openAddDialog
  );

document
  .getElementById("closeDialog")
  .addEventListener(
    "click",
    () => dialog.close()
  );

document
  .getElementById("cancelButton")
  .addEventListener(
    "click",
    () => dialog.close()
  );

searchInput.addEventListener(
  "input",
  renderLibrary
);

typeFilter.addEventListener(
  "change",
  renderLibrary
);

statusFilter.addEventListener(
  "change",
  renderLibrary
);

renderLibrary();

</script>

</body>
</html>
